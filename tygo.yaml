# TypeScript types generated from this store's Go wire types. The Go structs
# are the source of truth; ts/ is a render of them. Regenerate with
# ./generate-ts.sh after changing a wire type. store.go holds only internals.
packages:
  - path: "github.com/kayushkin/repo-store"
    output_path: "ts/model.ts"
    type_mappings:
      "json.RawMessage": "unknown"
      "time.Time": "string"
    exclude_files:
      - "store.go"
      - "pull_request_store.go"
      - "pull_request_sync.go"
      - "pull_request_server.go"
